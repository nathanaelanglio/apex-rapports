<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="APEX Automation">
<!-- Favicon APEX Automation — 22/08/2026, agent design.
     L'éclair reprend le tracé officiel M13 2 4 14h6l-1 8 9-12h-6l1-8Z, mis à
     l'échelle par transform : il n'est PAS redessiné à la main, la règle du
     LISEZ-MOI est respectée au caractère près.
     Le dégradé de marque est conservé à 135°, violet en premier. Le halo violet
     du logo n'est pas repris : à 16 px il empâte la forme au lieu de la
     détacher. Un favicon n'est pas un logo réduit, c'est le logo réécrit
     pour 32 px — on garde ce qui reste lisible et on retire le reste. -->
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8B5CF6"/>
    <stop offset="1" stop-color="#0EA5E9"/>
  </linearGradient>
</defs>
<rect width="32" height="32" rx="9" fill="url(#g)"/>
<g transform="translate(4 4) scale(1)">
  <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="#fff"/>
</g>
</svg>
